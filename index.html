<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divokvěty by Lenia</title>
<meta name="description" content="Divokvěty by Lenia — obří svítící květiny.">
<link rel="icon" href="images/brand/kvetina-wine.svg" type="image/svg+xml">
<style>
:root{
  --canvas:#FBFAF6;
  --wine:#4A1419;
  --line:#E7E2D6;
  --dim:#8A7F72;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.shell{max-width:1340px;margin:0 auto;padding:0 32px}

/* ---------- hlavička značky ---------- */
.brand{
  text-align:center;
  padding:clamp(56px,9vw,110px) 0 clamp(52px,8vw,96px);
  background:
    radial-gradient(120% 90% at 50% 0%, #FFFDF8 0%, transparent 62%),
    radial-gradient(80% 70% at 88% 18%, #FAF3E9 0%, transparent 66%);
}
.brand .lockup{width:min(280px,58vw);height:auto;margin:0 auto clamp(30px,4.5vw,46px)}
.brand .wordmark{width:min(560px,84vw);height:auto;margin:0 auto}
.brand .tagline{width:min(250px,52vw);height:auto;margin:clamp(26px,4vw,42px) auto 0;opacity:.78}

/* ---------- videopás ---------- */
.stripe{position:relative;overflow:hidden;background:#150806;height:clamp(230px,32vw,400px)}
.stripe video,.stripe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stripe img{display:none}
@media (prefers-reduced-motion:reduce){.stripe video{display:none}.stripe img{display:block}}

/* ---------- produkty vedle sebe ---------- */
.pieces{padding:clamp(56px,8vw,104px) 0 clamp(50px,7vw,84px)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(18px,2.4vw,30px);align-items:center}
@media (min-width:560px){.row{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){.row{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1040px){.row{grid-template-columns:repeat(7,1fr)}}
.piece{
  height:clamp(190px,18vw,246px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .45s cubic-bezier(.22,.61,.36,1);
}
.piece picture{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.piece img{
  max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 16px 26px rgba(74,20,25,.13));
  transition:transform .45s cubic-bezier(.22,.61,.36,1),filter .45s ease;
}
.piece.big{height:clamp(250px,26vw,340px)}
.piece:hover{transform:translateY(-8px)}
.piece:hover img{transform:scale(1.07);filter:drop-shadow(0 24px 36px rgba(74,20,25,.2))}

/* ---------- fotky ---------- */
.shots{padding:0 0 clamp(60px,8vw,104px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,1.8vw,26px)}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .grid figure:nth-child(3n+2){margin-top:44px}
}
.grid figure{margin:0;border-radius:14px;overflow:hidden;background:#F1EEE5}
.grid img{
  width:100%;height:100%;object-fit:cover;aspect-ratio:4/5;
  transition:transform .7s cubic-bezier(.22,.61,.36,1);
}
.grid figure:hover img{transform:scale(1.04)}

/* ---------- patička ---------- */
footer{padding:0 0 clamp(48px,7vw,80px);text-align:center}
footer .sig{width:clamp(104px,12vw,140px);height:auto;margin:0 auto;opacity:.78}
.social{display:flex;justify-content:center;gap:26px;margin:26px 0 0;padding:0;list-style:none}
.social a{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);color:var(--wine);background:#fff;
  transition:border-color .2s ease,transform .2s ease;
}
.social a:hover{border-color:var(--wine);transform:translateY(-2px)}
.social svg{width:19px;height:19px;display:block}
.copy{
  margin:26px 0 0;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
</style>
</head>
<body>

<header class="brand">
  <img class="lockup" src="images/brand/lenia-s-kvetinou-wine.svg" alt="Lenia">
  <h1 style="margin:0"><img class="wordmark" src="images/brand/divokvety-wine.svg" alt="Divokvěty"></h1>
  <img class="tagline" src="images/brand/male-velke-zazraky-wine.svg" alt="Malé velké zázraky">
</header>

<div class="stripe">
  <video autoplay muted loop playsinline preload="metadata" poster="images/videostripe-poster.jpg" aria-hidden="true">
    <source src="videos/videostripe.webm" type="video/webm">
    <source src="videos/videostripe.mp4" type="video/mp4">
  </video>
  <img src="images/videostripe-poster.jpg" alt="">
</div>

<section class="pieces">
  <div class="shell">
    <div class="row">
      <div class="piece"><picture><source srcset="images/produkty/produkt-1.webp" type="image/webp"><img src="images/produkty/produkt-1.png" alt="Fialový závěsný květ" loading="lazy"></picture></div>
      <div class="piece"><picture><source srcset="images/produkty/produkt-2.webp" type="image/webp"><img src="images/produkty/produkt-2.png" alt="Růžová stojací lampa se dvěma květy" loading="lazy"></picture></div>
      <div class="piece"><picture><source srcset="images/produkty/produkt-3.webp" type="image/webp"><img src="images/produkty/produkt-3.png" alt="Krémově bílý závěsný květ" loading="lazy"></picture></div>
      <div class="piece big"><picture><source srcset="images/produkty/produkt-4.webp" type="image/webp"><img src="images/produkty/produkt-4.png" alt="Detail oranžového květu na stonku" loading="lazy"></picture></div>
      <div class="piece"><picture><source srcset="images/produkty/produkt-5.webp" type="image/webp"><img src="images/produkty/produkt-5.png" alt="Žlutý závěsný květ" loading="lazy"></picture></div>
      <div class="piece"><picture><source srcset="images/produkty/produkt-6.webp" type="image/webp"><img src="images/produkty/produkt-6.png" alt="Červená stojací lampa se dvěma květy" loading="lazy"></picture></div>
      <div class="piece"><picture><source srcset="images/produkty/produkt-7.webp" type="image/webp"><img src="images/produkty/produkt-7.png" alt="Broskvový závěsný květ" loading="lazy"></picture></div>
    </div>
  </div>
</section>

<section class="shots">
  <div class="shell">
    <div class="grid">
      <figure><picture><source srcset="images/foto/interier-1.webp" type="image/webp"><img src="images/foto/interier-1.jpg" alt="Oranžový závěsný květ v prosklené zimní zahradě" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-2.webp" type="image/webp"><img src="images/foto/interier-2.jpg" alt="Žlutý závěsný květ ve světlém obývacím pokoji u moře" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-3.webp" type="image/webp"><img src="images/foto/interier-3.jpg" alt="Růžová stojací lampa u okna měšťanského bytu" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-4.webp" type="image/webp"><img src="images/foto/interier-4.jpg" alt="Jantarový závěsný květ v pokoji s výhledem do hor" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-5.webp" type="image/webp"><img src="images/foto/interier-5.jpg" alt="Purpurový závěsný květ v tmavě modré ložnici" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-6.webp" type="image/webp"><img src="images/foto/interier-6.jpg" alt="Červená stojací lampa v kamenném domě za soumraku" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-7.webp" type="image/webp"><img src="images/foto/interier-7.jpg" alt="Růžový závěsný květ ve večerním obývacím pokoji s krbem" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-8.webp" type="image/webp"><img src="images/foto/interier-8.jpg" alt="Malinová stojací lampa v pokoji s výhledem do bambusu" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/interier-9.webp" type="image/webp"><img src="images/foto/interier-9.jpg" alt="Bílý závěsný květ v betonovém loftu" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/portret-1.webp" type="image/webp"><img src="images/foto/portret-1.jpg" alt="Fialový závěsný květ na večerní terase" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/portret-2.webp" type="image/webp"><img src="images/foto/portret-2.jpg" alt="Tvarování okvětních lístků velkého červeného květu" loading="lazy"></picture></figure>
      <figure><picture><source srcset="images/foto/portret-3.webp" type="image/webp"><img src="images/foto/portret-3.jpg" alt="Rozsvícený červený květ na večerní akci" loading="lazy"></picture></figure>
    </div>
  </div>
</section>

<footer>
  <img class="sig" src="images/brand/lenia-wine.svg" alt="Lenia">
  <ul class="social">
    <li><a href="https://fb.com/divokvety" aria-label="Facebook" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8.5V6.8c0-.8.2-1.2 1.4-1.2H17V2.6c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.2H8.6v3h2.5V21H14v-9.5h2.5l.4-3H14z"/></svg>
    </a></li>
    <li><a href="https://instagram.com/divokvety" aria-label="Instagram" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </a></li>
    <li><a href="mailto:lenia.divokvety@gmail.com" aria-label="E-mail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/>
      </svg>
    </a></li>
  </ul>
  <p class="copy">© Lenia Wildflowers — Ostrava</p>
</footer>

</body>
</html>
